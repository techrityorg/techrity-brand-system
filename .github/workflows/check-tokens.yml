name: Check design tokens

on:
  push:
    paths: ['design-tokens/**', 'brands/*/design-tokens/**', 'scripts/**']
  pull_request:
    paths: ['design-tokens/**', 'brands/*/design-tokens/**', 'scripts/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tokens in sync, roles complete, contrast passes
        run: python3 scripts/check_tokens.py
